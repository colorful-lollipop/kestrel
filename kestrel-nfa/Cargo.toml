[package]
name = "kestrel-nfa"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
test-utils = []
redis-backend = ["redis", "deadpool-redis", "bincode", "moka"]

[dependencies]
# Workspace dependencies
kestrel-core = { path = "../kestrel-core" }
kestrel-schema = { path = "../kestrel-schema" }
kestrel-event = { path = "../kestrel-event" }
kestrel-eql = { path = "../kestrel-eql" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ahash = { workspace = true }
smallvec = { workspace = true, features = ["serde"] }
futures = "0.3"

# Additional dependencies
parking_lot = "0.12"
priority-queue = "2.0"

# Redis backend (optional)
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"], optional = true }
deadpool-redis = { version = "0.15", optional = true }
bincode = { version = "1.3", optional = true }
moka = { version = "0.12", features = ["future"], optional = true }
