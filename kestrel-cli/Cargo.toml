[package]
name = "kestrel-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "kestrel"
path = "src/main.rs"

[features]
default = ["ebpf"]
ebpf = ["dep:kestrel-ebpf", "dep:aya"]
macos = ["dep:kestrel-collector-macos"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
kestrel-engine = { path = "../kestrel-engine", features = ["wasm", "lua"] }
kestrel-schema = { path = "../kestrel-schema" }
kestrel-event = { path = "../kestrel-event" }
kestrel-rules = { path = "../kestrel-rules" }
kestrel-core = { path = "../kestrel-core" }

# Optional platform dependencies (Linux eBPF)
aya = { workspace = true, optional = true }
kestrel-ebpf = { path = "../kestrel-ebpf", optional = true }

# Optional platform dependencies (macOS)
kestrel-collector-macos = { path = "../kestrel-collector-macos", optional = true }
