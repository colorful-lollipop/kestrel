id: lateral-movement-minimal
name: Lateral Movement Simulation
category: lateral-movement
severity: high
status: draft
summary: >-
  Simulates a minimal lateral-movement style workflow using safe loopback-only
  SSH-style command patterns and outbound connection previews for Battle Lab,
  replay, and regression validation.

objectives:
  - validate lateral movement detection rules
  - validate process + network correlation for remote access style behavior
  - provide a deterministic scenario for replay-first rule tuning

safe_defaults:
  execute_by_default: false
  requires_isolation: true
  requires_loopback_only: true
  notes:
    - By default the script only prints the simulated remote execution chain.
    - Set KESTREL_LAB_EXECUTE=1 to execute the active simulation.
    - The active path uses loopback destinations and harmless shell commands.

telemetry_expectations:
  categories:
    - process
    - network
  important_fields:
    - process.executable
    - process.command_line
    - process.operation
    - network.destination
    - network.dest_port
    - network.operation

recommended_rules:
  - latmove-001

success_criteria:
  expected_alerts_min: 1
  required_rule_ids:
    - latmove-001

execution:
  entrypoint: attack.sh
  env:
    DEFAULT_HOST: 127.0.0.1
    DEFAULT_PORT: 2222
