id: credential-access-minimal
name: Credential Access Simulation
category: credential-access
severity: critical
status: draft
summary: >-
  Simulates suspicious access to credential-like material using safe temporary
  files by default, with an optional real-target mode for isolated environments.

objectives:
  - validate credential access rules
  - validate file-open telemetry for sensitive file names
  - provide a replay-friendly scenario for false-positive tuning

safe_defaults:
  execute_by_default: false
  requires_isolation: true
  requires_real_target_opt_in: true
  notes:
    - By default the script creates and reads a fake credential file in /tmp.
    - Set KESTREL_LAB_EXECUTE=1 to execute file access steps.
    - Set KESTREL_LAB_ALLOW_REAL_TARGETS=1 to target real sensitive paths inside an isolated lab only.

telemetry_expectations:
  categories:
    - process
    - file
  important_fields:
    - process.executable
    - process.operation
    - file.name
    - file.path
    - file.directory
    - file.inode
    - file.operation

recommended_rules:
  - credaccess-001

success_criteria:
  expected_alerts_min: 1
  required_rule_ids:
    - credaccess-001

execution:
  entrypoint: attack.sh
  env:
    SAFE_TARGET: /tmp/kestrel_lab_fake_shadow
    REAL_TARGET: /etc/shadow
