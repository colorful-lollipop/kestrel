[package]
name = "kestrel-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
kestrel-core = { path = "../kestrel-core" }
kestrel-rules = { path = "../kestrel-rules" }
kestrel-schema = { path = "../kestrel-schema" }
kestrel-event = { path = "../kestrel-event" }
kestrel-nfa = { path = "../kestrel-nfa" }
kestrel-observability = { path = "../kestrel-observability" }
arc-swap = "1.7"
wat = "1.0"
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
smallvec = { workspace = true }
ahash = { workspace = true }
kestrel-runtime-wasm = { path = "../kestrel-runtime-wasm", optional = true }
kestrel-runtime-lua = { path = "../kestrel-runtime-lua", optional = true }
kestrel-eql = { path = "../kestrel-eql", optional = true }

[features]
default = ["wasm", "lua"]
wasm = ["kestrel-runtime-wasm", "kestrel-eql"]
lua = ["kestrel-runtime-lua"]

[dev-dependencies]
tempfile = "3.13"
kestrel-nfa = { path = "../kestrel-nfa", features = ["test-utils"] }
